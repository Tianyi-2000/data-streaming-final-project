# Local Kafka for the streaming-fraud pipeline — no Confluent required.
#
# Redpanda is a Kafka-compatible broker: your Python clients talk to it exactly
# like Apache Kafka (bootstrap server localhost:9092). The console is a web UI
# for inspecting topics/keys/partitions (good for report screenshots).
#
# ArangoDB is the graph layer (Phase 8), and it is OPT-IN behind the `graph`
# profile. The two keyed consumers each answer a counting question; neither can
# see coordination *structure*, because structure is a property of the
# relationships rather than of any one key. The graph holds listeners and tracks
# as vertices and plays as edges, so a co-listening query can find a set of
# accounts that touched a near-identical set of tracks.
#
# WHY THE PROFILE. HRNS-01 guarantees that nothing beyond the broker is REQUIRED
# to run the pipeline, and `tests/test_harness_roundtrip.py` asserts it by
# checking that this file declares no service beyond the broker and the console.
# The graph is a v2 addition and must not weaken a v1 guarantee to fit, so it is
# opt-in rather than the assertion being widened to admit it: a plain
# `docker compose up -d` still yields exactly the v1 services. The optionality is
# structural, not documented -- profiled services are invisible to a plain
# `docker compose config --services`, so the v1 test needed no edit at all.
#
# Usage:
#   docker compose up -d                    # v1 stack: broker + console
#   docker compose --profile graph up -d    # ALSO start ArangoDB (Phase 8)
#   docker compose ps                       # check status
#   docker compose down                     # stop and remove containers
#   docker compose down -v                  # also wipe stored messages AND the graph
#
# EVERY graph command needs `--profile graph`. Without it compose starts the v1
# services and exits 0 having done nothing about ArangoDB -- no error, no
# container, and then an empty graph. That silent-success shape is this project's
# recurring failure mode, so the flag is in every command in GRAPH.md too.
#
# After it's up:
#   Broker (for code):   localhost:9092
#   Web console:         http://localhost:8080
#   ArangoDB web UI:     http://localhost:8531   (user root, see ARANGO_ROOT_PASSWORD below)

name: streaming-fraud-kafka

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      # INTERNAL = other containers (console); EXTERNAL = your host (Python).
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"     # Kafka API — this is what your producer/consumer use
      - "9644:9644"     # admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  console:
    image: redpandadata/console:v2.7.2
    container_name: redpanda-console
    depends_on:
      - redpanda
    ports:
      - "8080:8080"     # open http://localhost:8080 in your browser
    environment:
      KAFKA_BROKERS: redpanda:29092

  arangodb:
    # OPT-IN, AND THE PROFILE IS THE POINT -- see the header note above.
    # `docker compose up -d` starts the v1 pipeline and nothing else;
    # `docker compose --profile graph up -d` adds this. That keeps HRNS-01's
    # guarantee -- nothing beyond the broker is REQUIRED to run the pipeline --
    # structurally true rather than true-by-reinterpretation, which is why the
    # v1 harness test that asserts it needed no edit to accommodate the graph.
    profiles: ["graph"]
    image: arangodb/arangodb:3.12
    # A container name specific to THIS project. The Docker daemon on this
    # machine is shared: naming a container `arangodb` would collide with an
    # unrelated one that already exists here.
    container_name: streaming-fraud-arangodb
    ports:
      # HOST PORT 8531, NOT THE DEFAULT 8529, AND THIS IS DELIBERATE.
      # Two ArangoDB instances belonging to *other, unrelated projects* already
      # hold this machine's 8529 and 8530. Binding either would take down live
      # work that this repository has no business touching and cannot restore.
      # The container still listens on its own default 8529 inside the network;
      # only the host side moves. Python clients use http://localhost:8531.
      - "8531:8529"
    environment:
      # A LOCAL-DEVELOPMENT CREDENTIAL, and nothing more: a throwaway container
      # on a non-default port holding entirely synthetic data. Override it by
      # exporting ARANGO_ROOT_PASSWORD (or putting it in .env, already
      # gitignored) if you want something else. There is no real listening
      # history in this project -- per-account history is private and is listed
      # as out of scope -- so this database holds generated labels only.
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:-streamingfraud}
    volumes:
      # A named volume, so `docker compose down` keeps the graph and `docker
      # compose down -v` wipes it -- the same lifecycle the broker's storage
      # already has (Redpanda gets an anonymous volume from its own image, which
      # `down -v` removes too). That keeps the "wipe and start fresh"
      # instruction in README.md and DEMO.md true for the graph as well.
      - arangodb-data:/var/lib/arangodb3
    healthcheck:
      # A real readiness probe, not a sleep: authenticate and ask the server for
      # its version. `docker compose ps` reports healthy only once the HTTP API
      # is actually answering queries, which is what the loader needs.
      test:
        - "CMD-SHELL"
        - >-
          arangosh --server.endpoint tcp://127.0.0.1:8529
          --server.username root
          --server.password "$$ARANGO_ROOT_PASSWORD"
          --javascript.execute-string "db._version()"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  connect:
    # THE SAME `graph` PROFILE AS ARANGODB, DELIBERATELY NOT A SECOND ONE.
    # A plain `docker compose up -d` must still yield exactly the v1 stack, and
    # a half-configured Connect worker that failed to start would otherwise
    # break the one command the whole pipeline is judged on -- for everyone,
    # including a future reader who never wanted the graph at all.
    profiles: ["graph"]
    image: confluentinc/cp-kafka-connect:7.6.1
    container_name: streaming-fraud-connect
    depends_on:
      redpanda:
        condition: service_healthy
      arangodb:
        condition: service_healthy
    ports:
      - "8083:8083"     # the Connect REST API, used to POST the connectors
    environment:
      # THE CONTAINER TALKS TO THE CONTAINER. `redpanda:29092` is the INTERNAL
      # listener; `localhost:9092` is the EXTERNAL one and means "inside this
      # Connect container", where nothing is listening. Getting this wrong is
      # the single most common way a Connect setup fails in a compose file that
      # already defines both listeners, and it fails slowly -- the worker starts,
      # reports RUNNING, and never consumes anything.
      CONNECT_BOOTSTRAP_SERVERS: redpanda:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: streaming-fraud-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      # Single-node broker, so the internal topics cannot be replicated further.
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # The emitter produces plain JSON with no schema envelope, and UTF-8 ids
      # as keys. Each connector restates these too, so a config read on its own
      # is still complete.
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      # Lets a connector config reference a secret by path instead of embedding
      # it, which is why no password appears in connect/*.json.
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    volumes:
      # The verified connector JAR. Mounted read-only: the worker needs to read
      # the plugin, never to write it.
      - ./connect/plugins:/usr/share/confluent-hub-components:ro
      # The database credential, generated from $ARANGO_ROOT_PASSWORD at run
      # time and gitignored -- see connect/README.md.
      - ./connect/secrets:/etc/connect-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  # Named so `docker compose down -v` from THIS directory removes it and nothing
  # else. The compose project is `streaming-fraud-kafka`, so the real volume is
  # `streaming-fraud-kafka_arangodb-data` and cannot collide with another
  # project's.
  arangodb-data:
